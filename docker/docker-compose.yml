version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cogitolearn_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cogitolearn_postgres
    environment:
      POSTGRES_DB: cogitolearn_db
      POSTGRES_USER: cogitolearn_user
      POSTGRES_PASSWORD: cogitolearn_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
